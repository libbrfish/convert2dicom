[project]
name = "convert2dicom"
version = "0.1.0"
description = "Convert NIfTI / 3D-TIFF / PNG-slice directories to DICOM using a donor DICOM for metadata"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "KUL_NIS" },
]
dependencies = [
    "SimpleITK>=2.3",
    "pydicom>=2.4",
    "numpy>=1.24",
    "Pillow>=9.1",
    "ruff>=0.16.5",
    "jedi>=0.19.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
convert2dicom = "convert2dicom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convert2dicom"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
